function createTripVault({ key, endpoint, token, fetcher = fetch }) {
  const encoder = new TextEncoder(), decoder = new TextDecoder();

      }

    const left = new Map(before.customLinks.map(link => [link.id,link]));
    const right = new Map(after.customLinks.map(link => [link.id,link]));
    for (const id of new Set([...left.keys(), ...right.keys()])) if (JSON.stringify(left.get(id)) !== JSON.stringify(right.get(id))) patch.links.push([id, right.get(id) || null]);

  }
  function apply(state, patch) {
    const next = clone(state);
    for (const [name, operations] of Object.entries(patch.maps)) for (const [id, present, value] of operations) {
      if (present) next[name][id] = value; else delete next[name][id];
    }
    const links = new Map(next.customLinks.map(link => [link.id, link]));

  }
  async function request(method = 'GET', body) {
    let response;
    try { response = await fetcher(endpoint, {
      method, mode: 'cors', credentials: 'omit', cache: 'no-store', referrerPolicy: 'no-referrer',
      headers: { Authorization: 'Bearer ' + token, ...(body ? { 'Content-Type': 'application/json' } : {}) },
      ...(body ? { body: JSON.stringify(body) } : {}), signal: AbortSignal.timeout(15000)
    }); } catch { throw Error('Cannot reach shared notes. Keep this page open and retry when connected, or export a backup.'); }
    if (response.status === 401) throw Error('The travel password has changed. Export any unsaved notes, then unlock again.');
    if (!response.ok && response.status !== 409) throw Error('Shared notes are unavailable. Your edits remain here; retry saving or export a backup.');

  return {
    load, save,
    hasPending() { return Boolean(running || pending.length); },
    close() { closed = true; clearInterval(timer); listeners.clear(); window.removeEventListener('focus',poll); },
    subscribe(callback) { listeners.add(callback); return () => listeners.delete(callback); },
    async exportState(value) {

    lock() { closed = true; clearInterval(timer); listeners.clear(); window.removeEventListener('focus',poll); location.reload(); },

    _test: { encrypt, decrypt, normalize, diff, apply, close() {closed=true;clearInterval(timer);} }
  };

const travelCrypto = (() => {
  const encoder = new TextEncoder(), decoder = new TextDecoder();
  const aad = encoder.encode('private-travel-access-v1');
  const to64 = value => { let s=''; for(let i=0;i<value.length;i+=8192)s+=String.fromCharCode(...value.subarray(i,i+8192));return btoa(s); };
  const from64 = value => Uint8Array.from(atob(value), c=>c.charCodeAt(0));
  const random = n => crypto.getRandomValues(new Uint8Array(n));
  const newToken = () => to64(random(32)).replaceAll('+','-').replaceAll('/','_').replaceAll('=','');
  const importDataKey = raw => crypto.subtle.importKey('raw',from64(raw),'AES-GCM',false,['encrypt','decrypt']);

    const material=await crypto.subtle.importKey('raw',encoder.encode(password),'PBKDF2',false,['deriveKey']);
    return crypto.subtle.deriveKey({name:'PBKDF2',hash:'SHA-256',iterations:600000,salt:from64(salt)},material,{name:'AES-GCM',length:256},false,['encrypt','decrypt']);

  }
  async function unwrap(password,envelope) {
    if(envelope?.format!=='travel-access-v1'||envelope.iterations!==600000)throw Error('Unsupported access record.');

    const clear=await crypto.subtle.decrypt({name:'AES-GCM',iv:from64(envelope.iv),additionalData:aad},key,from64(envelope.ciphertext));

})();

function createTravelHub({key,legacyKey,credentials,endpoint,defaultTrip,fetcher=fetch,onLock=()=>location.reload()}) {
  const vaults=new Map();
  let rotating=false,catalogState=null,catalogPromise=null,catalogQueue=Promise.resolve();
  const catalogListeners=new Set();
  function vault(id) {
    if(!/^[a-z0-9][a-z0-9-]{0,63}$/.test(id))throw Error('Invalid trip.');

  }
  function trip(value) {
    if(!value||!/^([a-z0-9][a-z0-9-]{0,63})$/.test(value.id)||value.id==='catalog')throw Error('Invalid trip details.');
    const result={id:value.id,kind:value.id===defaultTrip.id?'big-island':'custom'};
    for(const name of ['title','destination','startDate','endDate','summary'])result[name]=typeof value[name]==='string'?value[name].trim().slice(0,name==='summary'?2000:160):'';
    if(!result.title)throw Error('Give the trip a title.');
    for(const name of ['startDate','endDate'])if(result[name]&&!/^\d{4}-\d{2}-\d{2}$/.test(result[name]))throw Error('Use a valid trip date.');
    if(result.startDate&&result.endDate&&result.endDate<result.startDate)throw Error('End date must follow start date.');
    return result;
  }
  function list() {
    const values=new Map([[defaultTrip.id,defaultTrip]]);
    for(const [id,raw] of Object.entries(catalogState?.notes||{}))try{const value=trip(JSON.parse(raw));if(value.id===id)values.set(id,value);}catch{}
    return [...values.values()].map(value=>({...value}));
  }
  function receive(state) { catalogState=state;for(const fn of catalogListeners)fn(list()); }

    if(!catalogPromise)catalogPromise=vault('catalog').load().then(state=>{receive(state);vault('catalog').subscribe(receive);}).catch(error=>{catalogPromise=null;throw error;});
    await catalogPromise;return list();
  }
  function saveTrip(value) {
    const cleaned=trip(value);
    const work=catalogQueue.catch(()=>{}).then(async()=>{await loadCatalog();const state=JSON.parse(JSON.stringify(catalogState));state.notes[cleaned.id]=JSON.stringify(cleaned);receive(await vault('catalog').save(state));return list();});

  }

    const response=await fetcher(endpoint+'/api/access',{cache:'no-store',credentials:'omit',referrerPolicy:'no-referrer',signal:AbortSignal.timeout(15000)});

    if(rotating)throw Error('A password change is already in progress.');
    if(typeof newPassword!=='string'||newPassword.length<16)throw Error('Use at least 16 characters, such as four memorable words.');
    if(newPassword!==newPassword.trim())throw Error('Remove spaces from the beginning or end of the new password.');

      const replacement={...decoded,token:travelCrypto.newToken()};
      const envelope=await travelCrypto.wrap(newPassword,replacement),tokenHash=await travelCrypto.tokenHash(replacement.token);

      try{response=await fetcher(endpoint+'/api/access',{method:'PUT',credentials:'omit',cache:'no-store',referrerPolicy:'no-referrer',headers:{Authorization:'Bearer '+credentials.token,'Content-Type':'application/json'},body:JSON.stringify({expectedVersion:before.version,envelope,tokenHash}),signal:AbortSignal.timeout(15000)});}catch{}
      if(!response?.ok){
        const after=await access();
        if(JSON.stringify(after.envelope)!==JSON.stringify(envelope))throw Error(response?.status===409||response?.status===401?'Access changed elsewhere. Lock and unlock again.':'The password was not changed. Try again when connected.');
      }
      lock();
    } finally { rotating=false; }
  }
  return {loadCatalog,saveTrip,subscribeCatalog(fn){catalogListeners.add(fn);return()=>catalogListeners.delete(fn);},async openVault(id){if(id==='catalog')throw Error('Choose a trip.');return vault(id);},changePassword,lock};

document.getElementById('unlock').addEventListener('submit',async event=>{
  event.preventDefault();const button=document.getElementById('open'),field=document.getElementById('password'),message=document.getElementById('error');
  button.disabled=true;button.textContent='Opening…';message.textContent='';let stage='network';
  try {
    const response=await fetch(endpoint+'/api/access',{credentials:'omit',cache:'no-store',referrerPolicy:'no-referrer',signal:AbortSignal.timeout(15000)});
    if(!response.ok)throw Error();const access=await response.json();stage='password';
    const credentials=await travelCrypto.unwrap(field.value.trim(),access.envelope);
    const key=await travelCrypto.importDataKey(credentials.dataKey),legacyKey=await travelCrypto.importDataKey(credentials.legacyDataKey);
    const clear=await crypto.subtle.decrypt({name:'AES-GCM',iv:travelCrypto.from64(bundle.iv),additionalData:new TextEncoder().encode('private-trip-bundle-v1')},key,travelCrypto.from64(bundle.ciphertext));
    const data=JSON.parse(new TextDecoder().decode(clear));
    field.value='';window.TravelHub=createTravelHub({key,legacyKey,credentials,endpoint,defaultTrip:data.defaultTrip});
    const frame=document.createElement('iframe');frame.title='Private travel hub';
    frame.setAttribute('sandbox','allow-scripts allow-same-origin allow-forms allow-popups allow-popups-to-escape-sandbox allow-downloads allow-modals');
    frame.srcdoc=data.html;document.body.append(frame);document.getElementById('gate').hidden=true;
  }catch(error){message.textContent=stage==='network'?'Cannot reach your travel notebook. Check your connection and try again.':'That password did not open the notebook. Please try again.';field.focus();}
  finally{button.disabled=false;button.textContent='Open travel notebook';}
});
