<script>
// Included inline in the public password gate. Secrets are supplied only after decryption.
function createTripVault({ key, endpoint, token, fetcher = fetch }) {
  const encoder = new TextEncoder(), decoder = new TextDecoder();
  const aad = encoder.encode('private-trip-state-v1');
  const empty = () => ({ version: 1, notes: {}, checked: {}, customLinks: [], statuses: {} });
  const clone = value => JSON.parse(JSON.stringify(value));
  const safeKey = key => !['__proto__', 'prototype', 'constructor'].includes(key);
  const normalize = value => {
    if (!value || typeof value !== 'object' || Array.isArray(value)) throw Error('This backup is not a trip notebook.');
    const result = empty();
    for (const field of ['notes', 'checked', 'statuses']) {
      const map = value[field];
      if (map && typeof map === 'object' && !Array.isArray(map)) {
        for (const [name, entry] of Object.entries(map)) {
          if (safeKey(name) && name.length <= 150 &&
              (field === 'checked' ? typeof entry === 'boolean' : typeof entry === 'string' && entry.length <= 100000)) result[field][name] = entry;
        }
      }
    }
    const ids = new Set();
    for (const link of (Array.isArray(value.customLinks) ? value.customLinks : []).slice(0, 500)) {
      if (!link || typeof link.id !== 'string' || !safeKey(link.id) || ids.has(link.id)) continue;
      if (typeof link.url !== 'string' || link.url.length > 4000) continue;
      try { if (!['https:', 'http:'].includes(new URL(link.url).protocol)) continue; } catch { continue; }
      ids.add(link.id);
      const cleaned = {};
      for (const [name, entry] of Object.entries(link)) if (safeKey(name) && ['string', 'number', 'boolean'].includes(typeof entry)) cleaned[name] = typeof entry === 'string' ? entry.slice(0, 10000) : entry;
      result.customLinks.push(cleaned);
    }
    if (encoder.encode(JSON.stringify(result)).byteLength > 500000) throw Error('Notebook is too large. Export a backup and shorten some notes.');
    return result;
  };
  const to64 = bytes => { let text = ''; for (let i=0;i<bytes.length;i+=8192) text += String.fromCharCode(...bytes.subarray(i,i+8192)); return btoa(text); };
  const from64 = text => Uint8Array.from(atob(text), c => c.charCodeAt(0));
  async function encrypt(value) {
    const iv = crypto.getRandomValues(new Uint8Array(12));
    const cipher = new Uint8Array(await crypto.subtle.encrypt({ name: 'AES-GCM', iv, additionalData: aad }, key, encoder.encode(JSON.stringify(normalize(value)))));
    const bytes = new Uint8Array(12 + cipher.length); bytes.set(iv); bytes.set(cipher, 12); return to64(bytes);
  }
  async function decrypt(blob) {
    const bytes = from64(blob);
    const text = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: bytes.slice(0,12), additionalData: aad }, key, bytes.slice(12));
    return normalize(JSON.parse(decoder.decode(text)));
  }
  function diff(before, after) {
    const patch = { maps: {}, links: [] };
    for (const name of ['notes', 'checked', 'statuses']) {
      patch.maps[name] = [];
      for (const id of new Set([...Object.keys(before[name]), ...Object.keys(after[name])])) {
        if (JSON.stringify(before[name][id]) !== JSON.stringify(after[name][id])) patch.maps[name].push([id, Object.hasOwn(after[name],id), after[name][id]]);
      }
    }
    const left = new Map(before.customLinks.map(link => [link.id,link]));
    const right = new Map(after.customLinks.map(link => [link.id,link]));
    for (const id of new Set([...left.keys(), ...right.keys()])) if (JSON.stringify(left.get(id)) !== JSON.stringify(right.get(id))) patch.links.push([id, right.get(id) || null]);
    return patch;
  }
  function apply(state, patch) {
    const next = clone(state);
    for (const [name, operations] of Object.entries(patch.maps)) for (const [id, present, value] of operations) {
      if (present) next[name][id] = value; else delete next[name][id];
    }
    const links = new Map(next.customLinks.map(link => [link.id, link]));
    for (const [id, value] of patch.links) { if (value) links.set(id, value); else links.delete(id); }
    next.customLinks = [...links.values()];
    return normalize(next);
  }
  async function request(method = 'GET', body) {
    let response;
    try { response = await fetcher(endpoint, {
      method, mode: 'cors', credentials: 'omit', cache: 'no-store', referrerPolicy: 'no-referrer',
      headers: { Authorization: 'Bearer ' + token, ...(body ? { 'Content-Type': 'application/json' } : {}) },
      ...(body ? { body: JSON.stringify(body) } : {}), signal: AbortSignal.timeout(15000)
    }); } catch { throw Error('Cannot reach shared notes. Keep this page open and retry when connected, or export a backup.'); }
    if (response.status === 401) throw Error('The travel password has changed. Export any unsaved notes, then unlock again.');
    if (!response.ok && response.status !== 409) throw Error('Shared notes are unavailable. Your edits remain here; retry saving or export a backup.');
    const value = await response.json();
    if (!Number.isSafeInteger(value.version) || value.version < 0 || (value.blob !== null && typeof value.blob !== 'string')) throw Error('Shared notes returned an invalid response.');
    return { ...value, conflict: response.status === 409 };
  }
  let view = empty(), revision = -1, running = null, polling = false, closed = false;
  const pending = [], listeners = new Set();
  const emit = () => { for (const callback of listeners) callback(clone(view)); };
  async function load() {
    const row = await request();
    const saved = row.blob ? await decrypt(row.blob) : empty();
    revision = row.version; view = pending.reduce(apply, saved); return clone(view);
  }
  async function flush() {
    while (pending.length) {
      const patch = pending[0];
      let row = await request(), success = false;
      for (let attempt = 0; attempt < 6; attempt++) {
        const latest = row.blob ? await decrypt(row.blob) : empty();
        const merged = apply(latest, patch);
        row = await request('PUT', { expectedVersion: row.version, blob: await encrypt(merged) });
        if (!row.conflict) {
          pending.shift(); revision = row.version;
          view = pending.reduce(apply, merged); emit(); success = true; break;
        }
      }
      if (!success) throw Error('Another edit arrived at the same time. Please retry saving.');
    }
    return clone(view);
  }
  function save(value) {
    if (closed) return Promise.reject(Error('This notebook is locked. Unlock again to save.'));
    const next = normalize(value);
    pending.push(diff(view,next)); view = next;
    if (!running) running = flush().finally(() => { running = null; });
    return running;
  }
  async function poll() {
    if (closed || running || pending.length || polling || document.hidden) return;
    polling = true;
    try {
      const row = await request();
      if (!running && !pending.length && row.version > revision) {
        const latest = row.blob ? await decrypt(row.blob) : empty();
        if (!running && !pending.length && row.version > revision) { revision = row.version; view = latest; emit(); }
      }
    } catch { /* Saving reports actionable errors; polling never destroys local edits. */ }
    finally { polling = false; }
  }
  const timer = setInterval(poll, 8000);
  window.addEventListener('focus', poll);
  return {
    load, save,
    hasPending() { return Boolean(running || pending.length); },
    close() { closed = true; clearInterval(timer); listeners.clear(); window.removeEventListener('focus',poll); },
    subscribe(callback) { listeners.add(callback); return () => listeners.delete(callback); },
    async exportState(value) {
      const blob = new Blob([JSON.stringify({ format: 'private-trip-backup-v1', blob: await encrypt(value) })], { type: 'application/json' });
      const url = URL.createObjectURL(blob), a = document.createElement('a'); a.href = url; a.download = 'trip-notebook-encrypted.json'; a.click(); setTimeout(() => URL.revokeObjectURL(url), 1000);
    },
    async importState(file) {
      if (file.size > 900000) throw Error('This backup is too large.');
      try { const data = JSON.parse(await file.text()); if (data.format !== 'private-trip-backup-v1') throw Error(); return await decrypt(data.blob); }
      catch { throw Error('This backup cannot be opened with this trip password.'); }
    },
    lock() { closed = true; clearInterval(timer); listeners.clear(); window.removeEventListener('focus',poll); location.reload(); },
    // Used by local tests; the downloaded page exposes only the API above through TripVault.
    _test: { encrypt, decrypt, normalize, diff, apply, close() {closed=true;clearInterval(timer);} }
  };
}

// Discussion records are independent of the published itinerary. Keep an encrypted
// per-entry recovery copy and outbox, namespaced by the stable vault endpoint.
function createPersistentDiscussionVault({ vault, key, endpoint, storage }) {
  if (storage === undefined) { try { storage = localStorage; } catch { storage = null; } }
  const prefix = 'travel-discussion-recovery-v1:' + endpoint + ':';
  const encoder = new TextEncoder(), decoder = new TextDecoder();
  const aad = encoder.encode('private-discussion-recovery-v1:' + endpoint);
  const clone = x => JSON.parse(JSON.stringify(x));
  const empty = () => ({version:1, notes:{}, checked:{}, statuses:{}, customLinks:[]});
  const validId = id => /^entry-[a-zA-Z0-9-]{1,100}$/.test(id);
  let view = empty(), busy = 0, offline = false, restored = 0, closed = false;
  let queue = Promise.resolve(), pending = false;
  const listeners = new Set();
  const emit = () => { for (const fn of listeners) fn(clone(view)); };
  const encode64 = bytes => { let s=''; for(let i=0;i<bytes.length;i+=8192)s+=String.fromCharCode(...bytes.subarray(i,i+8192));return btoa(s); };
  async function seal(record) {
    const iv=crypto.getRandomValues(new Uint8Array(12));
    const cipher=new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM',iv,additionalData:aad},key,encoder.encode(JSON.stringify(record))));
    const bytes=new Uint8Array(iv.length+cipher.length);bytes.set(iv);bytes.set(cipher,12);return encode64(bytes);
  }
  async function readRecords() {
    const records=new Map();
    if(!storage)return records;
    const keys=[];for(let i=0;i<storage.length;i++){const k=storage.key(i);if(k?.startsWith(prefix))keys.push(k);}
    for(const k of keys){
      const encoded=storage.getItem(k);if(!encoded)continue;
      const bytes=Uint8Array.from(atob(encoded),c=>c.charCodeAt(0));
      const value=JSON.parse(decoder.decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:bytes.slice(0,12),additionalData:aad},key,bytes.slice(12))));
      if(!validId(value.id)||k!==prefix+value.id||typeof value.text!=='string')throw Error('A saved discussion recovery copy could not be read. It has not been overwritten.');
      records.set(value.id,{...value,encoded});
    }
    return records;
  }
  async function storeRecord(record) {
    if(!storage)return;
    const {encoded,...value}=record;
    storage.setItem(prefix+record.id,await seal(value));
  }
  function newer(left,right) {
    try{return Date.parse(JSON.parse(left).updatedAt)>Date.parse(JSON.parse(right).updatedAt);}catch{return false;}
  }
  function combine(remote,records) {
    const result=clone(remote);let changed=false;restored=0;
    for(const [id,r]of records){
      if(!Object.hasOwn(result.notes,id)) {result.notes[id]=r.text;if(typeof r.checked==='boolean')result.checked[id]=r.checked;changed=true;restored++;}
      else if(r.textPending&&!newer(result.notes[id],r.text)&&result.notes[id]!==r.text){result.notes[id]=r.text;changed=true;}
      if(r.checkedPending&&result.checked[id]!==r.checked){result.checked[id]=r.checked;changed=true;}
    }
    return {state:result,changed};
  }
  async function rememberConfirmed(state,records) {
    if(!storage)return;
    for(const [id,text]of Object.entries(state.notes)){
      if(!validId(id))continue;
      const previous=records.get(id),current=storage.getItem(prefix+id);
      // Another tab may have queued a newer edit while this request was in flight.
      if(current!==(previous?.encoded||null))continue;
      const encoded=await seal({id,text,checked:state.checked[id],textPending:false,checkedPending:false});
      if(storage.getItem(prefix+id)===current)storage.setItem(prefix+id,encoded);
    }
  }
  const status=()=>({offline,pending:pending||busy>0||vault.hasPending(),recovered:restored,localRecovery:Boolean(storage)});
  function exclusive(fn){
    if(closed)return Promise.reject(Error('This discussion is locked. Unlock again to save.'));
    busy++;
    const work=queue.catch(()=>{}).then(fn).finally(()=>{busy--;});queue=work;return work;
  }
  async function synchronize({allowOffline=false}={}) {
    const records=await readRecords();
    let remote;
    try{remote=await vault.load();}
    catch(error){
      offline=true;pending=true;
      if(allowOffline&&records.size){view=combine(empty(),records).state;emit();return clone(view);}
      throw error;
    }
    const merged=combine(remote,records);
    try{
      if(merged.changed||vault.hasPending()) {
        pending=true;
        await vault.save(merged.state);
        // A successful HTTP response is not enough: confirm the stored content.
        const confirmed=await vault.load();
        for(const [id,text]of Object.entries(merged.state.notes))if(validId(id)&&confirmed.notes[id]!==text&&!newer(confirmed.notes[id],text))throw Error('The server did not confirm this discussion note. Its recovery copy is still on this device.');
        for(const [id,r]of records)if(r.checkedPending&&confirmed.checked[id]!==r.checked)throw Error('The server did not confirm the note status. Retry syncing.');
        remote=confirmed;
      }
      view=clone(remote);await rememberConfirmed(view,records);offline=false;pending=false;emit();return clone(view);
    }catch(error){offline=true;pending=true;view=merged.state;emit();if(allowOffline)return clone(view);throw error;}
  }
  function save(value){
    const changes=[];
    for(const [id,text]of Object.entries(value.notes||{}))if(validId(id)){
      const textChanged=view.notes[id]!==text;
      const checkedChanged=typeof value.checked?.[id]==='boolean'&&view.checked[id]!==value.checked[id];
      if(textChanged||checkedChanged)changes.push({id,text,textChanged,checkedChanged,checked:value.checked?.[id]});
    }
    // Omitting an existing entry never means deletion. The discussion UI has no
    // delete action; an older page must not erase records it does not understand.
    view={...clone(value),notes:{...view.notes,...value.notes},checked:{...view.checked,...value.checked}};
    pending=true;
    return exclusive(async()=>{
      const records=await readRecords();
      for(const change of changes){const previous=records.get(change.id);await storeRecord({id:change.id,text:change.textChanged?change.text:(previous?.text||change.text),checked:change.checkedChanged?change.checked:previous?.checked,textPending:change.textChanged||previous?.textPending===true,checkedPending:change.checkedChanged||previous?.checkedPending===true});}
      if(!storage){
        // Browsers that disable local storage still get durable server saves.
        const remote=await vault.load();const next=clone(remote);
        for(const c of changes){if(c.textChanged)next.notes[c.id]=c.text;if(c.checkedChanged)next.checked[c.id]=c.checked;}
        await vault.save(next);view=await vault.load();
        for(const c of changes)if(c.textChanged&&view.notes[c.id]!==c.text&&!newer(view.notes[c.id],c.text))throw Error('The server did not confirm the note. Keep this page open and retry.');
        pending=false;offline=false;emit();return clone(view);
      }
      return synchronize();
    });
  }
  const unsubscribe=vault.subscribe(raw=>{
    if(closed||busy||pending)return;
    void exclusive(async()=>{const records=await readRecords();const combined=combine(raw,records);if(combined.changed){pending=true;await synchronize();}else{view=clone(raw);await rememberConfirmed(view,records);emit();}}).catch(()=>{offline=true;pending=true;});
  });
  const unload=event=>{if(busy||pending||vault.hasPending()){event.preventDefault();event.returnValue='';}};
  window.addEventListener('beforeunload',unload);
  return {
    load:()=>exclusive(()=>synchronize({allowOffline:true})),save,
    retryPending:()=>exclusive(()=>synchronize()),recoveryStatus:status,
    hasPending:()=>Boolean(busy||pending||vault.hasPending()),
    subscribe(fn){listeners.add(fn);return()=>listeners.delete(fn);},
    exportState:value=>vault.exportState(value),importState:file=>vault.importState(file),
    close(){closed=true;unsubscribe();listeners.clear();window.removeEventListener('beforeunload',unload);vault.close();},
    lock(){this.close();location.reload();}
  };
}

const travelCrypto = (() => {
  const encoder = new TextEncoder(), decoder = new TextDecoder();
  const aad = encoder.encode('private-travel-access-v1');
  const to64 = value => { let s=''; for(let i=0;i<value.length;i+=8192)s+=String.fromCharCode(...value.subarray(i,i+8192));return btoa(s); };
  const from64 = value => Uint8Array.from(atob(value), c=>c.charCodeAt(0));
  const random = n => crypto.getRandomValues(new Uint8Array(n));
  const newToken = () => to64(random(32)).replaceAll('+','-').replaceAll('/','_').replaceAll('=','');
  const importDataKey = raw => crypto.subtle.importKey('raw',from64(raw),'AES-GCM',false,['encrypt','decrypt']);
  async function passwordKey(password,salt) {
    const material=await crypto.subtle.importKey('raw',encoder.encode(password),'PBKDF2',false,['deriveKey']);
    return crypto.subtle.deriveKey({name:'PBKDF2',hash:'SHA-256',iterations:600000,salt:from64(salt)},material,{name:'AES-GCM',length:256},false,['encrypt','decrypt']);
  }
  async function wrap(password,payload) {
    const salt=to64(random(16)),iv=random(12),key=await passwordKey(password,salt);
    const cipher=await crypto.subtle.encrypt({name:'AES-GCM',iv,additionalData:aad},key,encoder.encode(JSON.stringify(payload)));
    return {format:'travel-access-v1',iterations:600000,salt,iv:to64(iv),ciphertext:to64(new Uint8Array(cipher))};
  }
  async function unwrap(password,envelope) {
    if(envelope?.format!=='travel-access-v1'||envelope.iterations!==600000)throw Error('Unsupported access record.');
    const key=await passwordKey(password,envelope.salt);
    const clear=await crypto.subtle.decrypt({name:'AES-GCM',iv:from64(envelope.iv),additionalData:aad},key,from64(envelope.ciphertext));
    const payload=JSON.parse(decoder.decode(clear));
    if(from64(payload.dataKey).length!==32||from64(payload.legacyDataKey).length!==32||!/^[A-Za-z0-9_-]{43}$/.test(payload.token))throw Error('Invalid access record.');
    return payload;
  }
  async function tokenHash(token) { return [...new Uint8Array(await crypto.subtle.digest('SHA-256',encoder.encode(token)))].map(b=>b.toString(16).padStart(2,'0')).join(''); }
  return {to64,from64,random,newToken,importDataKey,wrap,unwrap,tokenHash};
})();

function createTravelHub({key,legacyKey,credentials,endpoint,defaultTrip,defaultTrips=[defaultTrip],fetcher=fetch,onLock=()=>location.reload()}) {
  const vaults=new Map();
  let rotating=false,catalogState=null,catalogPromise=null,catalogQueue=Promise.resolve();
  const catalogListeners=new Set();
  function vault(id) {
    if(!/^[a-z0-9][a-z0-9-]{0,63}$/.test(id))throw Error('Invalid trip.');
    if(!vaults.has(id)) {
      const vaultKey=id===defaultTrip.id?legacyKey:key,vaultEndpoint=endpoint+'/api/vault/'+id;
      const base=createTripVault({key:vaultKey,endpoint:vaultEndpoint,token:credentials.token,fetcher});
      const api=id.endsWith('-discussion')?createPersistentDiscussionVault({vault:base,key:vaultKey,endpoint:vaultEndpoint}):base;
      delete api._test;
      const save=api.save;api.save=value=>rotating?Promise.reject(Error('Finish changing the password before editing.')):save(value);
      api.lock=lock;vaults.set(id,api);
    }
    return vaults.get(id);
  }
  function trip(value) {
    if(!value||!/^([a-z0-9][a-z0-9-]{0,63})$/.test(value.id)||value.id==='catalog')throw Error('Invalid trip details.');
    const result={id:value.id,kind:defaultTrips.find(t=>t.id===value.id)?.kind||'custom'};
    for(const name of ['title','destination','startDate','endDate','summary'])result[name]=typeof value[name]==='string'?value[name].trim().slice(0,name==='summary'?2000:160):'';
    if(!result.title)throw Error('Give the trip a title.');
    for(const name of ['startDate','endDate'])if(result[name]&&!/^\d{4}-\d{2}-\d{2}$/.test(result[name]))throw Error('Use a valid trip date.');
    if(result.startDate&&result.endDate&&result.endDate<result.startDate)throw Error('End date must follow start date.');
    return result;
  }
  function list() {
    const values=new Map(defaultTrips.map(t=>[t.id,t]));
    for(const [id,raw] of Object.entries(catalogState?.notes||{}))try{const value=trip(JSON.parse(raw));if(value.id===id){const builtIn=defaultTrips.find(t=>t.id===id);values.set(id,builtIn?{...value,startDate:builtIn.startDate,endDate:builtIn.endDate}:value);}}catch{}
    return [...values.values()].map(value=>({...value}));
  }
  function receive(state) { catalogState=state;for(const fn of catalogListeners)fn(list()); }
  async function loadCatalog() {
    if(!catalogPromise)catalogPromise=vault('catalog').load().then(state=>{receive(state);vault('catalog').subscribe(receive);}).catch(error=>{catalogPromise=null;throw error;});
    await catalogPromise;return list();
  }
  function saveTrip(value) {
    const cleaned=trip(value);
    const work=catalogQueue.catch(()=>{}).then(async()=>{await loadCatalog();const state=JSON.parse(JSON.stringify(catalogState));state.notes[cleaned.id]=JSON.stringify(cleaned);receive(await vault('catalog').save(state));return list();});
    catalogQueue=work;return work;
  }
  async function access() {
    const response=await fetcher(endpoint+'/api/access',{cache:'no-store',credentials:'omit',referrerPolicy:'no-referrer',signal:AbortSignal.timeout(15000)});
    if(!response.ok)throw Error('Cannot reach travel access. Try again when connected.');return response.json();
  }

document.getElementById('unlock').addEventListener('submit',async event=>{
  event.preventDefault();const button=document.getElementById('open'),field=document.getElementById('password'),message=document.getElementById('error');
  button.disabled=true;button.textContent='Opening…';message.textContent='';let stage='network';
  try {
    const response=await fetch(endpoint+'/api/access',{credentials:'omit',cache:'no-store',referrerPolicy:'no-referrer',signal:AbortSignal.timeout(15000)});
    if(!response.ok)throw Error();const access=await response.json();stage='password';
    const credentials=await travelCrypto.unwrap(field.value.trim(),access.envelope);
    const key=await travelCrypto.importDataKey(credentials.dataKey),legacyKey=await travelCrypto.importDataKey(credentials.legacyDataKey);
    const clear=await crypto.subtle.decrypt({name:'AES-GCM',iv:travelCrypto.from64(bundle.iv),additionalData:new TextEncoder().encode('private-trip-bundle-v1')},key,travelCrypto.from64(bundle.ciphertext));
    const data=JSON.parse(new TextDecoder().decode(clear));
    field.value='';window.TravelHub=createTravelHub({key,legacyKey,credentials,endpoint,defaultTrip:data.defaultTrip,defaultTrips:data.defaultTrips});
    const frame=document.createElement('iframe');frame.title='Private travel hub';
    frame.setAttribute('sandbox','allow-scripts allow-same-origin allow-forms allow-popups allow-popups-to-escape-sandbox allow-downloads allow-modals');
    frame.srcdoc=data.html;document.body.append(frame);document.getElementById('gate').hidden=true;
  }catch(error){message.textContent=stage==='network'?'Cannot reach your travel notebook. Check your connection and try again.':'That password did not open the notebook. Please try again.';field.focus();}
  finally{button.disabled=false;button.textContent='Open travel notebook';}
});
