// Included inline in the public password gate. Secrets are supplied only after decryption.
function createTripVault({ key, endpoint, token, fetcher = fetch }) {
  const encoder = new TextEncoder(), decoder = new TextDecoder();
  const aad = encoder.encode('private-trip-state-v1');
  const empty = () => ({ version: 1, notes: {}, checked: {}, customLinks: [], statuses: {} });
  const clone = value => JSON.parse(JSON.stringify(value));
  const safeKey = key => !['__proto__', 'prototype', 'constructor'].includes(key);
  const normalize = value => {
    if (!value || typeof value !== 'object' || Array.isArray(value)) throw Error('This backup is not a trip notebook.');
    const result = empty();
    for (const field of ['notes', 'checked', 'statuses']) {
      const map = value[field];
      if (map && typeof map === 'object' && !Array.isArray(map)) {
        for (const [name, entry] of Object.entries(map)) {
          if (safeKey(name) && name.length <= 150 &&
              (field === 'checked' ? typeof entry === 'boolean' : typeof entry === 'string' && entry.length <= 100000)) result[field][name] = entry;
        }
      }
    }
    const ids = new Set();
    for (const link of (Array.isArray(value.customLinks) ? value.customLinks : []).slice(0, 500)) {
      if (!link || typeof link.id !== 'string' || !safeKey(link.id) || ids.has(link.id)) continue;
      if (typeof link.url !== 'string' || link.url.length > 4000) continue;
      try { if (!['https:', 'http:'].includes(new URL(link.url).protocol)) continue; } catch { continue; }
      ids.add(link.id);
      const cleaned = {};
      for (const [name, entry] of Object.entries(link)) if (safeKey(name) && ['string', 'number', 'boolean'].includes(typeof entry)) cleaned[name] = typeof entry === 'string' ? entry.slice(0, 10000) : entry;
      result.customLinks.push(cleaned);
    }
    if (JSON.stringify(result).length > 500000) throw Error('Notebook is too large. Export a backup and shorten some notes.');
    return result;
  };
  const to64 = bytes => { let text = ''; for (let i=0;i<bytes.length;i+=8192) text += String.fromCharCode(...bytes.subarray(i,i+8192)); return btoa(text); };
  const from64 = text => Uint8Array.from(atob(text), c => c.charCodeAt(0));
  async function encrypt(value) {
    const iv = crypto.getRandomValues(new Uint8Array(12));
    const cipher = new Uint8Array(await crypto.subtle.encrypt({ name: 'AES-GCM', iv, additionalData: aad }, key, encoder.encode(JSON.stringify(normalize(value)))));
    const bytes = new Uint8Array(12 + cipher.length); bytes.set(iv); bytes.set(cipher, 12); return to64(bytes);
  }
  async function decrypt(blob) {
    const bytes = from64(blob);
    const text = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: bytes.slice(0,12), additionalData: aad }, key, bytes.slice(12));
    return normalize(JSON.parse(decoder.decode(text)));
  }
  function diff(before, after) {
    const patch = { maps: {}, links: [] };
    for (const name of ['notes', 'checked', 'statuses']) {
      patch.maps[name] = [];
      for (const id of new Set([...Object.keys(before[name]), ...Object.keys(after[name])])) {
        if (JSON.stringify(before[name][id]) !== JSON.stringify(after[name][id])) patch.maps[name].push([id, Object.hasOwn(after[name],id), after[name][id]]);
      }
    }
    const left = new Map(before.customLinks.map(link => [link.id,link]));
    const right = new Map(after.customLinks.map(link => [link.id,link]));
    for (const id of new Set([...left.keys(), ...right.keys()])) if (JSON.stringify(left.get(id)) !== JSON.stringify(right.get(id))) patch.links.push([id, right.get(id) || null]);
    return patch;
  }
  function apply(state, patch) {
    const next = clone(state);
    for (const [name, operations] of Object.entries(patch.maps)) for (const [id, present, value] of operations) {
      if (present) next[name][id] = value; else delete next[name][id];
    }
    const links = new Map(next.customLinks.map(link => [link.id, link]));
    for (const [id, value] of patch.links) { if (value) links.set(id, value); else links.delete(id); }
    next.customLinks = [...links.values()];
    return normalize(next);
  }
  async function request(method = 'GET', body) {
    let response;
    try { response = await fetcher(endpoint, {
      method, mode: 'cors', credentials: 'omit', cache: 'no-store', referrerPolicy: 'no-referrer',
      headers: { Authorization: 'Bearer ' + token, ...(body ? { 'Content-Type': 'application/json' } : {}) },
      ...(body ? { body: JSON.stringify(body) } : {}), signal: AbortSignal.timeout(15000)
    }); } catch { throw Error('Cannot reach shared notes. Keep this page open and retry when connected, or export a backup.'); }
    if (!response.ok && response.status !== 409) throw Error('Shared notes are unavailable. Your edits remain here; retry saving or export a backup.');
    const value = await response.json();
    if (!Number.isSafeInteger(value.version) || value.version < 0 || (value.blob !== null && typeof value.blob !== 'string')) throw Error('Shared notes returned an invalid response.');
    return { ...value, conflict: response.status === 409 };
  }
  let view = empty(), revision = -1, running = null, polling = false, closed = false;
  const pending = [], listeners = new Set();
  const emit = () => { for (const callback of listeners) callback(clone(view)); };
  async function load() {
    const row = await request();
    const saved = row.blob ? await decrypt(row.blob) : empty();
    revision = row.version; view = pending.reduce(apply, saved); return clone(view);
  }
  async function flush() {
    while (pending.length) {
      const patch = pending[0];
      let row = await request(), success = false;
      for (let attempt = 0; attempt < 6; attempt++) {
        const latest = row.blob ? await decrypt(row.blob) : empty();
        const merged = apply(latest, patch);
        row = await request('PUT', { expectedVersion: row.version, blob: await encrypt(merged) });
        if (!row.conflict) {
          pending.shift(); revision = row.version;
          view = pending.reduce(apply, merged); emit(); success = true; break;
        }
      }
      if (!success) throw Error('Another edit arrived at the same time. Please retry saving.');
    }
    return clone(view);
  }
  function save(value) {
    const next = normalize(value);
    pending.push(diff(view,next)); view = next;
    if (!running) running = flush().finally(() => { running = null; });
    return running;
  }
  async function poll() {
    if (closed || running || pending.length || polling || document.hidden) return;
    polling = true;
    try {
      const row = await request();
      if (!running && !pending.length && row.version > revision) {
        const latest = row.blob ? await decrypt(row.blob) : empty();
        if (!running && !pending.length && row.version > revision) { revision = row.version; view = latest; emit(); }
      }
    } catch { /* Saving reports actionable errors; polling never destroys local edits. */ }
    finally { polling = false; }
  }
  const timer = setInterval(poll, 8000);
  window.addEventListener('focus', poll);
  return {
    load, save,
    subscribe(callback) { listeners.add(callback); return () => listeners.delete(callback); },
    async exportState(value) {
      const blob = new Blob([JSON.stringify({ format: 'private-trip-backup-v1', blob: await encrypt(value) })], { type: 'application/json' });
      const url = URL.createObjectURL(blob), a = document.createElement('a'); a.href = url; a.download = 'trip-notebook-encrypted.json'; a.click(); setTimeout(() => URL.revokeObjectURL(url), 1000);
    },
    async importState(file) {
      if (file.size > 900000) throw Error('This backup is too large.');
      try { const data = JSON.parse(await file.text()); if (data.format !== 'private-trip-backup-v1') throw Error(); return await decrypt(data.blob); }
      catch { throw Error('This backup cannot be opened with this trip password.'); }
    },
    lock() { closed = true; clearInterval(timer); listeners.clear(); window.removeEventListener('focus',poll); location.reload(); },
    // Used by local tests; the downloaded page exposes only the API above through TripVault.
    _test: { encrypt, decrypt, normalize, diff, apply, close() {closed=true;clearInterval(timer);} }
  };
}

const decode64 = text => Uint8Array.from(atob(text), character => character.charCodeAt(0));
document.getElementById('unlock').addEventListener('submit',async event=>{
  event.preventDefault(); const button=document.getElementById('open'),field=document.getElementById('password'),message=document.getElementById('error');
  button.disabled=true;button.textContent='Opening…';message.textContent='';
  try {
    if (!crypto.subtle) throw Error('secure-context');
    const encoder=new TextEncoder();
    const material=await crypto.subtle.importKey('raw',encoder.encode(field.value.trim()),'PBKDF2',false,['deriveKey']);
    const key=await crypto.subtle.deriveKey({name:'PBKDF2',hash:'SHA-256',salt:decode64(bundle.salt),iterations:600000},material,{name:'AES-GCM',length:256},false,['encrypt','decrypt']);
    const clear=await crypto.subtle.decrypt({name:'AES-GCM',iv:decode64(bundle.iv),additionalData:encoder.encode('private-trip-bundle-v1')},key,decode64(bundle.ciphertext));
    const data=JSON.parse(new TextDecoder().decode(clear));field.value='';
    const api=createTripVault({key,endpoint:data.endpoint,token:data.token});delete api._test;window.TripVault=api;
    const frame=document.createElement('iframe');frame.title='Private travel notebook';
    frame.setAttribute('sandbox','allow-scripts allow-same-origin allow-forms allow-popups allow-popups-to-escape-sandbox allow-downloads allow-modals');
    frame.srcdoc=data.html;document.body.append(frame);document.getElementById('gate').hidden=true;
  } catch(error) {message.textContent=error.message==='secure-context'?'Open this link using HTTPS in a current browser.':'That password did not open the trip. Please try again.';field.focus();}
  finally {button.disabled=false;button.textContent='Unlock itinerary';}
});
